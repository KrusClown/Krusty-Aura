<!DOCTYPE html>
<html lang="en" data-theme="green">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Krusty — Biography</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ══ Matrix rain canvas ══ -->
<canvas id="matrix"></canvas>

<!-- ══════════════════════════
     LANGUAGE SWITCHER (top-right)
     ══════════════════════════ -->
<div id="lang-switcher" class="lang-switcher" role="navigation" aria-label="Language"></div>

<!-- ══════════════════════════
     BIOGRAPHY CARD
     ══════════════════════════ -->
<div class="card">
  <div class="avatar-wrap">
    <img
      src="Whatuwantdude.jpeg"
      alt="Krusty profile photo"
      onerror="this.style.display='none'; this.parentNode.innerHTML='<div class=\'avatar-placeholder\'><span class=\'ph-icon\'>◈</span><span class=\'ph-text\'>Add photo</span></div>';"
    />
  </div>

  <!-- ── Name & role ── -->
  <div class="name">Krusty</div>
  <div class="role">Crazy Programmer</div>

  <div class="divider"></div>

  <!-- ── Biography description ── -->
  <p class="description">
    Developer passionate about open-source, clean architecture,
    and building tools that make a difference. Always exploring
    new technologies and sharing knowledge with the community.
  </p>

  <div class="divider"></div>

  <!-- ── GitHub profile link ── -->
  <a class="github-link" href="https://github.com/KrusClown" target="_blank" rel="noopener">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <path d="M12 0C5.37 0 0 5.37 0 12c0 5.31 3.435 9.795 8.205 11.385.6.105.825-.255.825-.57
               0-.285-.015-1.23-.015-2.235-3.015.555-3.795-.735-4.035-1.41-.135-.345-.72-1.41
               -1.23-1.695-.42-.225-1.02-.78-.015-.795.945-.015 1.62.87 1.845 1.23 1.08 1.815
               2.805 1.305 3.495.99.105-.78.42-1.305.765-1.605-2.67-.3-5.46-1.335-5.46-5.925
               0-1.305.465-2.385 1.23-3.225-.12-.3-.54-1.53.12-3.18 0 0 1.005-.315 3.3 1.23
               .96-.27 1.98-.405 3-.405s2.04.135 3 .405c2.295-1.56 3.3-1.23 3.3-1.23.66 1.65
               .24 2.88.12 3.18.765.84 1.23 1.905 1.23 3.225 0 4.605-2.805 5.625-5.475 5.925
               .435.375.81 1.095.81 2.22 0 1.605-.015 2.895-.015 3.3 0 .315.225.69.825.57
               A12.02 12.02 0 0 0 24 12c0-6.63-5.37-12-12-12z"/>
    </svg>
    github.com/KrusClown
  </a>

</div>

<!-- ══════════════════════════
     THEME SWITCHER (bottom-center)
     ══════════════════════════ -->
<div class="theme-switcher" role="group" aria-label="Color theme">
  <button class="theme-btn active" data-color="green"  title="Green"  aria-label="Green theme"></button>
  <button class="theme-btn"        data-color="red"    title="Red"    aria-label="Red theme"></button>
  <button class="theme-btn"        data-color="purple" title="Purple" aria-label="Purple theme"></button>
  <button class="theme-btn"        data-color="blue"   title="Blue"   aria-label="Blue theme"></button>
  <button class="theme-btn"        data-color="rgb"    title="RGB"    aria-label="RGB mode"></button>
</div>

<!-- ══ Scripts ══ -->
<script src="matrix.js"></script>
<script src="theme.js"></script>
<script src="lang.js"></script>

</body>
</html>
